<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الإعدادات</title>

<style>

body{
    margin:0;
    background:#f4f4f4;
    font-family:Tahoma;
}

.header{
    background:#1b8f2d;
    color:white;
    text-align:center;
    padding:18px;
    font-size:24px;
    font-weight:bold;
}

.box{
    background:white;
    margin:12px;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.title{
    background:#1b8f2d;
    color:white;
    padding:10px;
    font-size:18px;
}

.item{

display:flex;
justify-content:space-between;
align-items:center;

padding:16px;

border-bottom:1px solid #ddd;

font-size:18px;

cursor:pointer;

}

.item:hover{

background:#f3fff3;

}

.switch{

width:22px;

height:22px;

}

.logout{

background:#d60000;

color:white;

text-align:center;

padding:18px;

font-size:20px;

border-radius:10px;

margin:20px;

cursor:pointer;

}

.logout:hover{

background:#b40000;

}

</style>

</head>

<body>

<div class="header">
⚙️ الإعدادات
</div>

<div class="box">

<div class="title">
👤 الحساب
</div>

<div class="item">
تغيير الصورة الشخصية
<span>📷</span>
</div>

<div class="item">
تعديل الاسم
<span>✏️</span>
</div>

<div class="item">
تغيير كلمة المرور
<span>🔒</span>
</div>

</div>

<div class="box">

<div class="title">
🔐 الخصوصية
</div>

<div class="item">
الحساب خاص
<input type="checkbox" class="switch">
</div>

<div class="item">
إخفاء الأصدقاء
<input type="checkbox" class="switch">
</div>

<div class="item">
إظهار الأصدقاء
<input type="checkbox" class="switch">
</div>

</div>

<div class="box">

<div class="title">
🔔 الإشعارات
</div>

<div class="item">
إشعارات الرسائل
<input type="checkbox" checked class="switch">
</div>

<div class="item">
إشعارات الإعجابات
<input type="checkbox" checked class="switch">
</div>

<div class="item">
الصوت
<input type="checkbox" checked class="switch">
</div>

</div>

<div class="box">

<div class="title">
🚫 الحظر
</div>

<div class="item">
المستخدمون المحظورون
<span>➡️</span>
</div>

<div class="item">
حظر مستخدم جديد
<span>➕</span>
</div>

</div>

<div class="box">

<div class="title">
🌍 اللغة
</div>

<div class="item">
العربية
<span>🇸🇦</span>
</div>

<div class="item">
Deutsch
<span>🇩🇪</span>
</div>

<div class="item">
English
<span>🇬🇧</span>
</div>

</div>

<div class="logout">
تسجيل الخروج
</div>

</body>
</html>
