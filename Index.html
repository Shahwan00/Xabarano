<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DTMD🌿</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    background:#f5f5f5;
    font-family:Arial,sans-serif;
    margin:0;
    padding:20px;
}

.container{
    max-width:450px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}

.logo{
    text-align:center;
    font-size:35px;
    font-weight:bold;
    color:green;
    margin-bottom:20px;
}

label{
    font-weight:bold;
    display:block;
    margin-top:10px;
}

input,
select{
    width:100%;
    padding:12px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
    box-sizing:border-box;
}

.error{
    color:red;
    font-size:13px;
    margin-top:3px;
}

button{
    width:100%;
    padding:14px;
    background:#1976d2;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    margin-top:20px;
    cursor:pointer;
}

button:hover{
    background:#0d5db8;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
DTMD
</div>

<label>الاسم الثلاثي</label>
<input type="text" id="fullname">
<div class="error" id="nameError"></div>

<label>البريد الإلكتروني</label>
<input type="email" id="email">
<div class="error" id="emailError"></div>

<label>كلمة المرور</label>
<input type="password" id="password">
<div class="error" id="passwordError"></div>

<label>تأكيد كلمة المرور</label>
<input type="

<label>تاريخ الميلاد</label>
<input type="date" id="birth">
<div class="error" id="birthError"></div>

<label>البرج</label>
<input type="text" id="zodiac" readonly placeholder="سيظهر تلقائياً">

<label>الحالة الاجتماعية</label>
<select id="status">
    <option value=""> اختر الحالة الاجتماعية </option>
    <option>أعزب</option>
    <option>عزباء</option>
    <option>متزوج</option>
    <option>متزوجة</option>
    <option>مطلق</option>
    <option>مطلقة</option>
</select>
<div class="error" id="statusError"></div>

<label>الجنس</label>
<select id="gender">
    <option value=""> اختر الجنس </option>
    <option>ذكر♂</option>
    <option>♀أنثى</option>
</select>
<div class="error" id="genderError"></div>

<label>هل حضرتك من أي طبقة اجتماعية إيزيدية؟</label>
<select id="class">
    <option value=""> اختر</option>
    <option>الشيخ</option>
    <option>البير</option>
    <option>المريد</option>
</select>
<div class="error" id="classError"></div>

<label>الدولة</label>
<input type="text" id="country">
<div class="error" id="countryError"></div>

<label>المنطقة</label>
<input type="text" id="region">
<div class="error" id="regionError"></div>

<label>المهنة</label>
<input type="text" id="job">
<div class="error" id="jobError"></div>

<label>اللغة الأم</label>
<input type="text" id="motherLanguage"
value="𐺩𐺏𐺨𐺋𐺨 Ezidisch" readonly>

<label>اللغة التي أتحدث بها</label>

<select id="language">
<option value=""> اختر اللغة </option>

<option>العربية</option>
<option>Deutsch</option>
<option>English</option>
<option>Türkçe</option>
<option>Français</option>
<option>Español</option>
<option>Nederlands</option>
<option>Norsk</option>
<option>Svenska</option>
<option>Dansk</option>
<option>Suomi</option>
<option>Italiano</option>
<option>Português</option>
<option>Русский</option>
<option>فارسی</option>
<option>中文</option>
<option>日本語</option>
<option>한국어</option>
<option>हिन्दी</option>

</select>

<select id="level">

<option>مبتدئ</option>
<option>متوسط</option>
<option>جيد</option>
<option>جيد جداً</option>
<option>ممتاز</option>
<option>اللغة الأم</option>

</select>

<div class="error" id="languageError"></div>

<div class="profile-upload">

    <label class="profile-label">الصورة الشخصية</label>

    <div class="profile-box" onclick="document.getElementById('profileImage').click()">

        <img id="previewImage"
        src="images/user.png"
        alt="الصورة الشخصية">

    </div>

    <input
        type="file"
        id="profileImage"
        accept="image/*"
        hidden
        onchange="previewProfile(event)">

    <p class="profile-text">
        اضغط على الصورة لاختيار صورة
    </p>

</div>
<button onclick="register()">
إنشاء الحساب
</button>

</div>

<script src="script.js"></script>

</body>

</html>
